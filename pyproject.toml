[project]
name = "okta-mcp-server"
version = "0.1.0"
description = "Okta MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "fastmcp>=4.0.5",
    "okta>=3.4.5",
    "requests>=2.34.2",
    "keyring>=25.7.0",
    "keyrings.alt>=5.0.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "ty>=0.0.71",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okta_mcp_server"]

[project.scripts]
okta-mcp-server = "okta_mcp_server.server:main"

[tool.ty.environment]
extra-paths = ["stubs"]
