# Security updates only. Dependabot opens PRs solely to fix known
# vulnerabilities, one grouped PR per ecosystem. Routine version bumps are
# disabled via open-pull-requests-limit: 0 (that limit applies only to version
# updates). Avoid "ignore" rules here: they suppress security updates too.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # no version updates; security updates still open
    labels: ["dependencies", "security"]
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # no version updates; security updates still open
    labels: ["dependencies", "security"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
