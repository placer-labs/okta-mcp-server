version: 2
updates:
  # cooldown: only propose releases that have been public for a week. Keep in
  # sync with MIN_AGE_DAYS in workflows/dependabot_automerge.yaml, which applies
  # the same age floor to security updates (which ignore cooldown).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image digest bumps are not auto-merged (no semver update type).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
