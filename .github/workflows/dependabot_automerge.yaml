name: dependabot auto-merge

# GitHub's documented pattern: enable native auto-merge on Dependabot PRs so
# GitHub merges them once the required status checks pass. Release age is
# handled by `cooldown` in .github/dependabot.yml (version updates wait 7 days;
# security updates skip the cooldown and merge as soon as CI is green).
on:
  pull_request:

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name

    permissions:
      contents: write       # enable auto-merge
      pull-requests: write  # approve

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Majors stay manual.
      - name: Enable auto-merge and approve
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: squash
        run: |
          gh pr merge --auto "--${MERGE_METHOD}" "$PR_URL"
          # Fails while the org disallows Actions approving PRs; auto-merge stays
          # armed and completes once a human approves.
          gh pr review --approve "$PR_URL" \
            || echo "::warning::Could not approve (org policy?); waiting for a human review."
