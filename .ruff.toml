# Exclude a variety of commonly ignored directories.
exclude = [
    ".bacon",
    ".git",
    ".github",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".idea",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
]

line-length = 119
indent-width = 4

[lint]
preview = true
select = ["F",      # Pyflakes
          "E",      # pycodestyle
          "I",      # isort
          "RUF",    # Ruff-specific rules
          "S",      # flake8-bandit
          "B",      # flake8-bugbear
          "ASYNC",  # blocking calls in async code
          "UP",     # pyupgrade
          "SIM",    # flake8-simplify
          "RET",    # flake8-return
          "PIE",    # flake8-pie
          "C4",     # flake8-comprehensions
          "PERF",   # Perflint
          "FURB",   # refurb
          "PTH",    # use pathlib
          "PT",     # flake8-pytest-style
          "LOG",    # flake8-logging
          "DTZ",    # naive datetimes
          "T20",    # print statements
          "ISC"]    # implicit string concatenation

ignore = [
    # `ruff format` handles line length for code; long lines that remain are
    # license-header boilerplate and other intentionally untouched text.
    "line-too-long",
    # typing.List/Optional -> list/X | None across every tool signature. Pure
    # style, and rewriting the upstream-derived tool modules would make every
    # future upstream port conflict.
    "non-pep585-annotation",
    "non-pep604-annotation-optional",
    "deprecated-import",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[format]
line-ending = "auto" # Automatically detect the appropriate line ending.
quote-style = "double" # Use double quotes for strings.
indent-style = "space" # Indent with spaces, rather than tabs.
skip-magic-trailing-comma = false # Respect magic trailing commas.


# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true


[lint.per-file-ignores]
# Ported verbatim from upstream; keep its naming and docstrings so syncs merge cleanly.
"src/okta_mcp_server/tools/customization/**" = ["ambiguous-unicode-character-string", "ambiguous-unicode-character-docstring", "ambiguous-unicode-character-comment", "used-dummy-variable"]
# Phase 1 of validate_file_path normalizes with abspath on purpose: it must not
# follow symlinks. Path.resolve() would, so os.path stays.
"src/okta_mcp_server/utils/validation.py" = ["os-path-abspath"]
"tests/**" = ["assert", "hardcoded-password-string", "hardcoded-password-func-arg", "hardcoded-temp-file"]
